name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 装 Android SDK(platform 36 + build-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 2026-10-02 起两个变体都编。原因（小米电视 192.168.150.10 实测，同一台机器同一套按键）：
      #   debug 包每帧 650ms、卡顿率 80%；release 包每帧 32ms、卡顿率 35%
      #   —— debug 变体不跑 AOT 编译，界面线程被解释执行拖死。装机一律用 release。
      - name: 编译 APK（debug + release）
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --build-cache

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: openemby-apk
          path: out/*.apk
          retention-days: 14

      - name: 发布到 Release(便于经镜像下载)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: B0BEmby build ${{ github.run_number }}
          body: 自动编译产物(debug+release,均为 fixedDebug 签名)
          files: out/*.apk
          draft: false
